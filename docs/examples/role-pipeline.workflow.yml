version: 2
type: kandev_workflow
workflows:
  - name: Role Pipeline
    description: Cheap spike resumes context, architect plans, implementer builds, reviewer checks. Human gate before Done.
    steps:
      - name: Backlog
        position: 0
        color: bg-neutral-400
        events: {}
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        complete_task_on_enter: false
      - name: Spike
        position: 1
        color: bg-cyan-500
        prompt: |
          ROLE: Spike (cheap context agent). Do NOT modify repository files.
          {{task_prompt}}

          When finished, save the full resume/handoff document as this task's plan with the
          create_task_plan_kandev MCP tool (update it if one exists), then call step_complete_kandev.
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: true
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: OpenCode
          model: opencode-go/deepseek-v4.1-flash
        profile_session_start_policy: new
        profile_session_end_policy: complete
        complete_task_on_enter: false
      - name: Architect
        position: 2
        color: bg-purple-500
        prompt: |
          ROLE: Architect. Read the task plan with get_task_plan_kandev: it is a resume handoff produced by a
          cheap spike agent from an earlier Codex planning conversation. Verify its claims against the
          repository (the working tree has intentional uncommitted work; never discard or reset it).
          Produce the final, ordered implementation plan with explicit verification commands and stop/rollback
          gates, and replace the task plan with it via edit/update of the task plan. Do NOT implement.
          Call step_complete_kandev when the plan is saved.
        events:
          on_turn_complete:
            - type: move_to_next
          on_enter:
            - type: auto_start_agent
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Codex
          model: gpt-5.6-sol
          mode: agent
        profile_session_start_policy: new
        profile_session_end_policy: park
        complete_task_on_enter: false
      - name: Implement
        position: 3
        color: bg-blue-500
        prompt: |
          ROLE: Implementer. Read the task plan with get_task_plan_kandev and implement it step by step in the
          current working tree, running the plan's verification commands. Preserve existing uncommitted work.
          Do not commit. Report what changed and test results, then call step_complete_kandev.
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Codex
          model: gpt-5.6-terra
          mode: agent
        profile_session_start_policy: new
        profile_session_end_policy: park
        complete_task_on_enter: false
      - name: Review
        position: 4
        color: bg-yellow-500
        prompt: |
          ROLE: Reviewer. Read the task plan (get_task_plan_kandev) and the implementer's conversation
          (get_task_conversation_kandev), then review the uncommitted diff against the plan. Report findings as
          BLOCKER / SUGGESTION with file:line. Do not edit files.
        events:
          on_enter:
            - type: auto_start_agent
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Claude
          model: opus[1m]
          mode: default
        profile_session_start_policy: new
        profile_session_end_policy: park
        complete_task_on_enter: false
      - name: Done
        position: 5
        color: bg-green-500
        events: {}
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        complete_task_on_enter: true
